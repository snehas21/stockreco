<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockReco – Analyst Rating Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #09101f;
      --surface:     #0e1629;
      --border:      #1c2b42;
      --text:        #dde8f6;
      --muted:       #5c7394;
      --accent:      #4d9eff;
      --buy:         #28c064;
      --hold:        #e09c1c;
      --sell:        #f04638;
      --strong-buy:  #1d5de0;
      --strong-sell: #c41c1c;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      background-image: radial-gradient(ellipse 90% 45% at 50% -5%, rgba(77, 158, 255, 0.1) 0%, transparent 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 52px 20px 80px;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #1a5de0, #4d9eff);
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(31, 104, 232, 0.45);
      flex-shrink: 0;
    }
    header h1 {
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--text);
    }
    header h1 span {
      background: linear-gradient(135deg, #4d9eff, #82c2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* ── SEARCH BOX ── */
    .search-wrap {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 24px;
    }
    .search-wrap input {
      flex: 1;
      padding: 14px 18px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-wrap input::placeholder {
      text-transform: none;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(77, 158, 255, 0.18);
    }
    .search-wrap button {
      padding: 14px 26px;
      background: linear-gradient(135deg, #1a5de0, #4d9eff);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(29, 93, 224, 0.4);
    }
    .search-wrap button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(29, 93, 224, 0.5);
    }
    .search-wrap button:active { transform: translateY(0); }
    .search-wrap button:disabled {
      opacity: 0.35;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    /* ── STATUS MESSAGES ── */
    #status {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 24px;
      min-height: 22px;
      text-align: center;
    }
    #status.error { color: var(--sell); }

    /* ── CARD ── */
    .card {
      width: 100%;
      max-width: 660px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      display: none;
      animation: fadeUp 0.4s ease;
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 0 50px rgba(77, 158, 255, 0.04);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
      opacity: 0.6;
    }
    .card.visible { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* company header */
    .company-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .company-info h2 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .company-info .ticker-tag {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 12px;
      background: rgba(77, 158, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(77, 158, 255, 0.25);
      border-radius: 20px;
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .verdict-badge {
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .verdict-badge.strong-buy {
      background: rgba(29, 93, 224, 0.18);
      color: #6babff;
      border: 1px solid rgba(29, 93, 224, 0.4);
      box-shadow: 0 0 24px rgba(29, 93, 224, 0.3);
    }
    .verdict-badge.buy {
      background: rgba(40, 192, 100, 0.15);
      color: #45d87a;
      border: 1px solid rgba(40, 192, 100, 0.35);
      box-shadow: 0 0 24px rgba(40, 192, 100, 0.2);
    }
    .verdict-badge.hold {
      background: rgba(224, 156, 28, 0.15);
      color: #f0b840;
      border: 1px solid rgba(224, 156, 28, 0.35);
    }
    .verdict-badge.underperform {
      background: rgba(240, 70, 56, 0.12);
      color: #ff6f64;
      border: 1px solid rgba(240, 70, 56, 0.3);
    }
    .verdict-badge.sell {
      background: rgba(196, 28, 28, 0.16);
      color: #ff8880;
      border: 1px solid rgba(196, 28, 28, 0.35);
      box-shadow: 0 0 24px rgba(196, 28, 28, 0.2);
    }

    /* section divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 25%, var(--border) 75%, transparent);
      margin: 22px 0;
    }

    /* price row */
    .price-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .price-item {
      flex: 1;
      min-width: 110px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      transition: border-color 0.2s;
    }
    .price-item:hover { border-color: rgba(77, 158, 255, 0.28); }
    .price-item .label {
      font-size: 0.67rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .price-item .value {
      font-size: 1.08rem;
      font-weight: 700;
    }
    .price-item .value.up   { color: var(--buy); }
    .price-item .value.down { color: var(--sell); }

    /* section title */
    .section-title {
      font-size: 0.67rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
      font-weight: 700;
      padding-left: 10px;
      border-left: 2px solid rgba(77, 158, 255, 0.55);
    }

    /* score gauge */
    .gauge-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 4px;
    }
    .gauge-track-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .gauge-track {
      height: 12px;
      background: linear-gradient(90deg,
        var(--strong-buy) 0%,
        var(--buy) 25%,
        var(--hold) 50%,
        var(--sell) 75%,
        var(--strong-sell) 100%
      );
      border-radius: 50px;
      position: relative;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .gauge-needle {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35), 0 3px 10px rgba(0, 0, 0, 0.5);
      transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gauge-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 7px;
    }
    .gauge-labels span {
      font-size: 0.58rem;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .gauge-score {
      font-size: 1.65rem;
      font-weight: 900;
      min-width: 54px;
      text-align: right;
      letter-spacing: -1px;
    }

    /* analyst bars */
    .analyst-bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .bar-row { display: flex; align-items: center; gap: 12px; }
    .bar-label {
      width: 110px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 50px;
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .bar-count {
      width: 28px;
      text-align: right;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }
    .bar-fill.strong-buy  { background: linear-gradient(90deg, #1d5de0, #5d9fff); }
    .bar-fill.buy         { background: linear-gradient(90deg, #1aa854, #40de7e); }
    .bar-fill.hold        { background: linear-gradient(90deg, #c98a10, #f5c040); }
    .bar-fill.underperform{ background: linear-gradient(90deg, #d43020, #ff6b60); }
    .bar-fill.sell        { background: linear-gradient(90deg, #a01010, #d44040); }

    /* analyst total */
    .analyst-total {
      font-size: 0.77rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    /* price target section */
    .target-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .target-item {
      flex: 1;
      min-width: 90px;
      text-align: center;
      padding: 14px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
    }
    .target-item.mean {
      background: rgba(77, 158, 255, 0.07);
      border-color: rgba(77, 158, 255, 0.25);
    }
    .target-item .t-label {
      font-size: 0.63rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .target-item .t-value { font-size: 1.05rem; font-weight: 700; }
    .target-item.mean .t-value { color: var(--accent); }

    .upside {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      margin-top: 10px;
    }
    .upside span.up   { color: var(--buy);  font-weight: 700; }
    .upside span.down { color: var(--sell); font-weight: 700; }

    /* data source */
    .data-source {
      margin-top: 20px;
      font-size: 0.68rem;
      color: rgba(92, 115, 148, 0.5);
      text-align: right;
      font-weight: 400;
    }

    /* loading spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* popular tickers */
    .popular {
      max-width: 520px;
      width: 100%;
      text-align: center;
      margin-bottom: 36px;
    }
    .popular p {
      font-size: 0.68rem;
      color: var(--muted);
      margin-bottom: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .popular-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .popular-list button {
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.15s;
    }
    .popular-list button:hover {
      background: rgba(77, 158, 255, 0.12);
      border-color: rgba(77, 158, 255, 0.4);
      color: var(--accent);
      transform: translateY(-1px);
    }

    @media (max-width: 500px) {
      body { padding: 32px 16px 60px; }
      .card { padding: 22px 18px; }
      header h1 { font-size: 1.85rem; }
      .logo-icon { width: 34px; height: 34px; }
      .gauge-score { font-size: 1.35rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <polyline points="2,15 7,9 11,12 16,5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="14,5 16,5 16,7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Stock<span>Reco</span></h1>
  </div>
  <p>Analyst consensus ratings &amp; price targets for any stock</p>
</header>

<div class="search-wrap">
  <input id="ticker-input" type="text" placeholder="Enter ticker (e.g. AAPL)" maxlength="10" autocomplete="off" />
  <button id="search-btn" onclick="lookup()">Analyse</button>
</div>

<div class="popular">
  <p>Popular tickers</p>
  <div class="popular-list">
    <button onclick="quickLookup('AAPL')">AAPL</button>
    <button onclick="quickLookup('MSFT')">MSFT</button>
    <button onclick="quickLookup('GOOGL')">GOOGL</button>
    <button onclick="quickLookup('AMZN')">AMZN</button>
    <button onclick="quickLookup('NVDA')">NVDA</button>
    <button onclick="quickLookup('TSLA')">TSLA</button>
    <button onclick="quickLookup('META')">META</button>
    <button onclick="quickLookup('JPM')">JPM</button>
  </div>
</div>

<div id="status"></div>

<div class="card" id="result-card">
  <div class="company-row">
    <div class="company-info">
      <h2 id="company-name">—</h2>
      <span class="ticker-tag" id="ticker-tag">—</span>
    </div>
    <div class="verdict-badge" id="verdict-badge">—</div>
  </div>

  <div class="price-row">
    <div class="price-item">
      <div class="label">Current Price</div>
      <div class="value" id="current-price">—</div>
    </div>
    <div class="price-item">
      <div class="label">Change (1d)</div>
      <div class="value" id="price-change">—</div>
    </div>
    <div class="price-item">
      <div class="label">Market Cap</div>
      <div class="value" id="market-cap">—</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section-title">Consensus Score</div>
  <div class="gauge-wrap">
    <div class="gauge-track-wrap">
      <div class="gauge-track">
        <div class="gauge-needle" id="gauge-needle" style="left:50%"></div>
      </div>
      <div class="gauge-labels">
        <span>Strong Buy</span>
        <span>Strong Sell</span>
      </div>
    </div>
    <div class="gauge-score" id="gauge-score">—</div>
  </div>

  <div class="divider"></div>

  <div class="section-title">Analyst Breakdown</div>
  <div class="analyst-bars" id="analyst-bars"></div>
  <div class="analyst-total" id="analyst-total"></div>

  <div class="divider"></div>

  <div class="section-title">12-Month Price Target</div>
  <div class="target-row">
    <div class="target-item">
      <div class="t-label">Low</div>
      <div class="t-value" id="target-low">—</div>
    </div>
    <div class="target-item mean">
      <div class="t-label">Mean Target</div>
      <div class="t-value" id="target-mean">—</div>
    </div>
    <div class="target-item">
      <div class="t-label">High</div>
      <div class="t-value" id="target-high">—</div>
    </div>
  </div>
  <div class="upside" id="upside-pct"></div>

  <div class="data-source">Data sourced from Yahoo Finance</div>
</div>

<script>
// Each entry is a function that wraps a target URL for that proxy's format.
// Tried in order; first successful JSON parse wins.
const PROXIES = [
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];

async function fetchViaProxy(targetUrl) {
  let lastErr;
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(targetUrl), { signal: AbortSignal.timeout(10000) });
      if (!res.ok) { lastErr = new Error('HTTP ' + res.status); continue; }
      const text = await res.text();
      // codetabs and allorigins can wrap errors in HTML; reject if not JSON
      if (!text.trimStart().startsWith('{') && !text.trimStart().startsWith('[')) {
        lastErr = new Error('Non-JSON response'); continue;
      }
      return JSON.parse(text);
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('All proxies failed');
}

function fmt(n, dec = 2) {
  if (n == null) return '—';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function fmtCap(n) {
  if (n == null) return '—';
  if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return '$' + (n / 1e6).toFixed(2) + 'M';
  return '$' + n.toLocaleString();
}

function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.className = isError ? 'error' : '';
}

function setBtn(disabled) {
  document.getElementById('search-btn').disabled = disabled;
}

function quickLookup(ticker) {
  document.getElementById('ticker-input').value = ticker;
  lookup();
}

function verdictFromKey(key, mean) {
  if (!key && mean == null) return { label: 'N/A', cls: 'hold' };
  const k = (key || '').toLowerCase();
  if (k === 'strong_buy'  || mean <= 1.5) return { label: 'STRONG BUY',   cls: 'strong-buy' };
  if (k === 'buy'         || mean <= 2.5) return { label: 'BUY',           cls: 'buy' };
  if (k === 'hold'        || mean <= 3.5) return { label: 'HOLD',          cls: 'hold' };
  if (k === 'underperform'|| mean <= 4.5) return { label: 'UNDERPERFORM',  cls: 'underperform' };
  return { label: 'SELL', cls: 'sell' };
}

async function lookup() {
  const raw = document.getElementById('ticker-input').value.trim().toUpperCase();
  if (!raw) { setStatus('Please enter a ticker symbol.', true); return; }

  setBtn(true);
  document.getElementById('result-card').classList.remove('visible');
  setStatus('<span class="spinner"></span>Fetching analyst data for ' + raw + '…');

  const modules = 'recommendationTrend,financialData,price';
  const makeYfUrl = host =>
    `https://${host}.finance.yahoo.com/v11/finance/quoteSummary/${encodeURIComponent(raw)}?modules=${modules}`;

  let data;
  try {
    // Try query1 first, then query2 as a mirror fallback
    try {
      data = await fetchViaProxy(makeYfUrl('query1'));
    } catch {
      data = await fetchViaProxy(makeYfUrl('query2'));
    }
  } catch (e) {
    setStatus('Network error – could not reach Yahoo Finance. Check your connection and try again.', true);
    setBtn(false);
    return;
  }

  const result = data?.quoteSummary?.result?.[0];
  const errMsg = data?.quoteSummary?.error?.description;
  if (!result || errMsg) {
    setStatus('Ticker "' + raw + '" not found or no data available. Check the symbol and try again.', true);
    setBtn(false);
    return;
  }

  const price   = result.price         || {};
  const fin     = result.financialData  || {};
  const recTrend= result.recommendationTrend?.trend || [];
  const latest  = recTrend[0] || {};

  // Company + ticker
  const companyName = price.longName || price.shortName || raw;
  document.getElementById('company-name').textContent = companyName;
  document.getElementById('ticker-tag').textContent   = raw;

  // Price
  const curPrice   = price.regularMarketPrice?.raw;
  const change     = price.regularMarketChange?.raw;
  const changePct  = price.regularMarketChangePercent?.raw;
  const cap        = price.marketCap?.raw;

  document.getElementById('current-price').textContent = curPrice != null ? '$' + fmt(curPrice) : '—';
  document.getElementById('market-cap').textContent    = fmtCap(cap);

  const chEl = document.getElementById('price-change');
  if (change != null) {
    const sign = change >= 0 ? '+' : '';
    chEl.textContent  = `${sign}$${fmt(Math.abs(change))} (${sign}${fmt(changePct * 100, 2)}%)`;
    chEl.className    = 'value ' + (change >= 0 ? 'up' : 'down');
  } else {
    chEl.textContent = '—';
    chEl.className   = 'value';
  }

  // Recommendation mean + key
  const mean  = fin.recommendationMean?.raw;
  const recKey= fin.recommendationKey;
  const verdict = verdictFromKey(recKey, mean);

  const badge = document.getElementById('verdict-badge');
  badge.textContent = verdict.label;
  badge.className   = 'verdict-badge ' + verdict.cls;

  // Gauge needle (1-5 maps to 0%-100%)
  const needlePct = mean != null ? ((mean - 1) / 4) * 100 : 50;
  document.getElementById('gauge-needle').style.left = Math.min(98, Math.max(2, needlePct)) + '%';
  document.getElementById('gauge-score').textContent = mean != null ? fmt(mean) : '—';

  // Analyst breakdown bars
  const barsData = [
    { label: 'Strong Buy',   key: 'strongBuy',  cls: 'strong-buy'   },
    { label: 'Buy',          key: 'buy',         cls: 'buy'          },
    { label: 'Hold',         key: 'hold',        cls: 'hold'         },
    { label: 'Underperform', key: 'sell',        cls: 'underperform' },
    { label: 'Sell',         key: 'strongSell',  cls: 'sell'         },
  ];

  const counts = barsData.map(b => ({ ...b, count: latest[b.key] ?? 0 }));
  const total  = counts.reduce((s, b) => s + b.count, 0);

  const barsEl = document.getElementById('analyst-bars');
  barsEl.innerHTML = counts.map(b => {
    const pct = total > 0 ? (b.count / total) * 100 : 0;
    return `
      <div class="bar-row">
        <span class="bar-label">${b.label}</span>
        <div class="bar-track">
          <div class="bar-fill ${b.cls}" style="width:${pct.toFixed(1)}%"></div>
        </div>
        <span class="bar-count">${b.count}</span>
      </div>`;
  }).join('');

  const period = latest.period === '0m' ? 'current month'
               : latest.period === '-1m' ? 'last month' : (latest.period || '');
  document.getElementById('analyst-total').textContent =
    total > 0 ? `${total} analysts rated this stock (${period})` : 'No analyst breakdown available.';

  // Price targets
  const tMean = fin.targetMeanPrice?.raw;
  const tLow  = fin.targetLowPrice?.raw;
  const tHigh = fin.targetHighPrice?.raw;

  document.getElementById('target-mean').textContent = tMean != null ? '$' + fmt(tMean) : '—';
  document.getElementById('target-low').textContent  = tLow  != null ? '$' + fmt(tLow)  : '—';
  document.getElementById('target-high').textContent = tHigh != null ? '$' + fmt(tHigh) : '—';

  const upsideEl = document.getElementById('upside-pct');
  if (tMean != null && curPrice != null && curPrice > 0) {
    const upside = ((tMean - curPrice) / curPrice) * 100;
    const sign   = upside >= 0 ? '+' : '';
    upsideEl.innerHTML = `Mean target implies <span class="${upside >= 0 ? 'up' : 'down'}">${sign}${fmt(upside, 1)}%</span> from current price`;
  } else {
    upsideEl.textContent = '';
  }

  setStatus('');
  setBtn(false);
  document.getElementById('result-card').classList.add('visible');
}

// Allow Enter key to trigger search
document.getElementById('ticker-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') lookup();
});
</script>
</body>
</html>
