<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockReco – Analyst Rating Checker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #7d8590;
      --accent:   #58a6ff;
      --buy:      #3fb950;
      --hold:     #d29922;
      --sell:     #f85149;
      --strong-buy:  #1f6feb;
      --strong-sell: #da3633;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    header h1 span { color: var(--accent); }
    header p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ── SEARCH BOX ── */
    .search-wrap {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 40px;
    }
    .search-wrap input {
      flex: 1;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input::placeholder { text-transform: none; font-weight: 400; letter-spacing: 0; color: var(--muted); }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap button {
      padding: 12px 22px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #0d1117;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .search-wrap button:hover { opacity: 0.85; }
    .search-wrap button:disabled { opacity: 0.45; cursor: default; }

    /* ── STATUS MESSAGES ── */
    #status {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 28px;
      min-height: 22px;
      text-align: center;
    }
    #status.error { color: var(--sell); }

    /* ── CARD ── */
    .card {
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 28px 24px;
      display: none;
      animation: fadeUp 0.35s ease;
    }
    .card.visible { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* company header */
    .company-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .company-info h2 {
      font-size: 1.35rem;
      font-weight: 700;
    }
    .company-info .ticker-tag {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 10px;
      background: rgba(88,166,255,0.12);
      color: var(--accent);
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .verdict-badge {
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .verdict-badge.strong-buy  { background: rgba(31,111,235,0.2);  color: #79c0ff; border: 1px solid rgba(31,111,235,0.4); }
    .verdict-badge.buy         { background: rgba(63,185,80,0.2);   color: #56d364; border: 1px solid rgba(63,185,80,0.4); }
    .verdict-badge.hold        { background: rgba(210,153,34,0.2);  color: #e3b341; border: 1px solid rgba(210,153,34,0.4); }
    .verdict-badge.underperform{ background: rgba(248,81,73,0.18);  color: #ff7b72; border: 1px solid rgba(248,81,73,0.35); }
    .verdict-badge.sell        { background: rgba(218,54,51,0.2);   color: #ffa198; border: 1px solid rgba(218,54,51,0.4); }

    /* price row */
    .price-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .price-item {
      flex: 1;
      min-width: 110px;
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .price-item .label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .price-item .value {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .price-item .value.up   { color: var(--buy); }
    .price-item .value.down { color: var(--sell); }

    /* section title */
    .section-title {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 14px;
      margin-top: 4px;
    }

    /* score gauge */
    .gauge-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .gauge-track {
      flex: 1;
      height: 10px;
      background: linear-gradient(90deg,
        var(--strong-buy) 0%,
        var(--buy) 25%,
        var(--hold) 50%,
        var(--sell) 75%,
        var(--strong-sell) 100%
      );
      border-radius: 50px;
      position: relative;
    }
    .gauge-needle {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      border: 3px solid #0d1117;
      box-shadow: 0 0 6px rgba(0,0,0,0.6);
      transition: left 0.5s ease;
    }
    .gauge-score {
      font-size: 1.5rem;
      font-weight: 800;
      min-width: 44px;
      text-align: right;
    }

    /* analyst bars */
    .analyst-bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .bar-row { display: flex; align-items: center; gap: 10px; }
    .bar-label {
      width: 105px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      height: 12px;
      background: rgba(255,255,255,0.06);
      border-radius: 50px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 50px;
      transition: width 0.5s ease;
    }
    .bar-count {
      width: 28px;
      text-align: right;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }
    .bar-fill.strong-buy  { background: var(--strong-buy); }
    .bar-fill.buy         { background: var(--buy); }
    .bar-fill.hold        { background: var(--hold); }
    .bar-fill.underperform{ background: var(--sell); }
    .bar-fill.sell        { background: var(--strong-sell); }

    /* analyst total */
    .analyst-total {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: -4px;
      margin-bottom: 20px;
    }

    /* price target section */
    .target-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .target-item {
      flex: 1;
      min-width: 90px;
      text-align: center;
      padding: 12px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .target-item.mean { background: rgba(88,166,255,0.08); border-color: rgba(88,166,255,0.25); }
    .target-item .t-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .target-item .t-value { font-size: 1.05rem; font-weight: 700; }
    .target-item.mean .t-value { color: var(--accent); }

    .upside {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      margin-top: 8px;
    }
    .upside span.up   { color: var(--buy);  font-weight: 700; }
    .upside span.down { color: var(--sell); font-weight: 700; }

    /* data source */
    .data-source {
      margin-top: 18px;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
    }

    /* loading spinner */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* popular tickers */
    .popular {
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin-bottom: 32px;
    }
    .popular p { font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; }
    .popular-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .popular-list button {
      padding: 5px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .popular-list button:hover { background: rgba(88,166,255,0.1); border-color: var(--accent); }

    @media (max-width: 500px) {
      .card { padding: 20px 16px; }
      header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Stock<span>Reco</span></h1>
  <p>Analyst consensus rating for any stock</p>
</header>

<div class="search-wrap">
  <input id="ticker-input" type="text" placeholder="Enter ticker (e.g. AAPL)" maxlength="10" autocomplete="off" />
  <button id="search-btn" onclick="lookup()">Analyse</button>
</div>

<div class="popular">
  <p>Popular tickers</p>
  <div class="popular-list">
    <button onclick="quickLookup('AAPL')">AAPL</button>
    <button onclick="quickLookup('MSFT')">MSFT</button>
    <button onclick="quickLookup('GOOGL')">GOOGL</button>
    <button onclick="quickLookup('AMZN')">AMZN</button>
    <button onclick="quickLookup('NVDA')">NVDA</button>
    <button onclick="quickLookup('TSLA')">TSLA</button>
    <button onclick="quickLookup('META')">META</button>
    <button onclick="quickLookup('JPM')">JPM</button>
  </div>
</div>

<div id="status"></div>

<div class="card" id="result-card">
  <div class="company-row">
    <div class="company-info">
      <h2 id="company-name">—</h2>
      <span class="ticker-tag" id="ticker-tag">—</span>
    </div>
    <div class="verdict-badge" id="verdict-badge">—</div>
  </div>

  <div class="price-row">
    <div class="price-item">
      <div class="label">Current Price</div>
      <div class="value" id="current-price">—</div>
    </div>
    <div class="price-item">
      <div class="label">Change (1d)</div>
      <div class="value" id="price-change">—</div>
    </div>
    <div class="price-item">
      <div class="label">Market Cap</div>
      <div class="value" id="market-cap">—</div>
    </div>
  </div>

  <div class="section-title">Consensus Score (1 = Strong Buy &nbsp;·&nbsp; 5 = Strong Sell)</div>
  <div class="gauge-wrap">
    <div class="gauge-track">
      <div class="gauge-needle" id="gauge-needle" style="left:50%"></div>
    </div>
    <div class="gauge-score" id="gauge-score">—</div>
  </div>

  <div class="section-title">Analyst Breakdown</div>
  <div class="analyst-bars" id="analyst-bars"></div>
  <div class="analyst-total" id="analyst-total"></div>

  <div class="section-title">12-Month Price Target</div>
  <div class="target-row">
    <div class="target-item">
      <div class="t-label">Low</div>
      <div class="t-value" id="target-low">—</div>
    </div>
    <div class="target-item mean">
      <div class="t-label">Mean Target</div>
      <div class="t-value" id="target-mean">—</div>
    </div>
    <div class="target-item">
      <div class="t-label">High</div>
      <div class="t-value" id="target-high">—</div>
    </div>
  </div>
  <div class="upside" id="upside-pct"></div>

  <div class="data-source">Data sourced from Yahoo Finance</div>
</div>

<script>
// Each entry is a function that wraps a target URL for that proxy's format.
// Tried in order; first successful JSON parse wins.
const PROXIES = [
  u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];

async function fetchViaProxy(targetUrl) {
  let lastErr;
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(targetUrl), { signal: AbortSignal.timeout(10000) });
      if (!res.ok) { lastErr = new Error('HTTP ' + res.status); continue; }
      const text = await res.text();
      // codetabs and allorigins can wrap errors in HTML; reject if not JSON
      if (!text.trimStart().startsWith('{') && !text.trimStart().startsWith('[')) {
        lastErr = new Error('Non-JSON response'); continue;
      }
      return JSON.parse(text);
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('All proxies failed');
}

function fmt(n, dec = 2) {
  if (n == null) return '—';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function fmtCap(n) {
  if (n == null) return '—';
  if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return '$' + (n / 1e6).toFixed(2) + 'M';
  return '$' + n.toLocaleString();
}

function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.className = isError ? 'error' : '';
}

function setBtn(disabled) {
  document.getElementById('search-btn').disabled = disabled;
}

function quickLookup(ticker) {
  document.getElementById('ticker-input').value = ticker;
  lookup();
}

function verdictFromKey(key, mean) {
  if (!key && mean == null) return { label: 'N/A', cls: 'hold' };
  const k = (key || '').toLowerCase();
  if (k === 'strong_buy'  || mean <= 1.5) return { label: 'STRONG BUY',   cls: 'strong-buy' };
  if (k === 'buy'         || mean <= 2.5) return { label: 'BUY',           cls: 'buy' };
  if (k === 'hold'        || mean <= 3.5) return { label: 'HOLD',          cls: 'hold' };
  if (k === 'underperform'|| mean <= 4.5) return { label: 'UNDERPERFORM',  cls: 'underperform' };
  return { label: 'SELL', cls: 'sell' };
}

async function lookup() {
  const raw = document.getElementById('ticker-input').value.trim().toUpperCase();
  if (!raw) { setStatus('Please enter a ticker symbol.', true); return; }

  setBtn(true);
  document.getElementById('result-card').classList.remove('visible');
  setStatus('<span class="spinner"></span>Fetching analyst data for ' + raw + '…');

  const modules = 'recommendationTrend,financialData,price';
  const makeYfUrl = host =>
    `https://${host}.finance.yahoo.com/v11/finance/quoteSummary/${encodeURIComponent(raw)}?modules=${modules}`;

  let data;
  try {
    // Try query1 first, then query2 as a mirror fallback
    try {
      data = await fetchViaProxy(makeYfUrl('query1'));
    } catch {
      data = await fetchViaProxy(makeYfUrl('query2'));
    }
  } catch (e) {
    setStatus('Network error – could not reach Yahoo Finance. Check your connection and try again.', true);
    setBtn(false);
    return;
  }

  const result = data?.quoteSummary?.result?.[0];
  const errMsg = data?.quoteSummary?.error?.description;
  if (!result || errMsg) {
    setStatus('Ticker "' + raw + '" not found or no data available. Check the symbol and try again.', true);
    setBtn(false);
    return;
  }

  const price   = result.price         || {};
  const fin     = result.financialData  || {};
  const recTrend= result.recommendationTrend?.trend || [];
  const latest  = recTrend[0] || {};

  // Company + ticker
  const companyName = price.longName || price.shortName || raw;
  document.getElementById('company-name').textContent = companyName;
  document.getElementById('ticker-tag').textContent   = raw;

  // Price
  const curPrice   = price.regularMarketPrice?.raw;
  const change     = price.regularMarketChange?.raw;
  const changePct  = price.regularMarketChangePercent?.raw;
  const cap        = price.marketCap?.raw;

  document.getElementById('current-price').textContent = curPrice != null ? '$' + fmt(curPrice) : '—';
  document.getElementById('market-cap').textContent    = fmtCap(cap);

  const chEl = document.getElementById('price-change');
  if (change != null) {
    const sign = change >= 0 ? '+' : '';
    chEl.textContent  = `${sign}$${fmt(Math.abs(change))} (${sign}${fmt(changePct * 100, 2)}%)`;
    chEl.className    = 'value ' + (change >= 0 ? 'up' : 'down');
  } else {
    chEl.textContent = '—';
    chEl.className   = 'value';
  }

  // Recommendation mean + key
  const mean  = fin.recommendationMean?.raw;
  const recKey= fin.recommendationKey;
  const verdict = verdictFromKey(recKey, mean);

  const badge = document.getElementById('verdict-badge');
  badge.textContent = verdict.label;
  badge.className   = 'verdict-badge ' + verdict.cls;

  // Gauge needle (1-5 maps to 0%-100%)
  const needlePct = mean != null ? ((mean - 1) / 4) * 100 : 50;
  document.getElementById('gauge-needle').style.left = Math.min(98, Math.max(2, needlePct)) + '%';
  document.getElementById('gauge-score').textContent = mean != null ? fmt(mean) : '—';

  // Analyst breakdown bars
  const barsData = [
    { label: 'Strong Buy',   key: 'strongBuy',  cls: 'strong-buy'   },
    { label: 'Buy',          key: 'buy',         cls: 'buy'          },
    { label: 'Hold',         key: 'hold',        cls: 'hold'         },
    { label: 'Underperform', key: 'sell',        cls: 'underperform' },
    { label: 'Sell',         key: 'strongSell',  cls: 'sell'         },
  ];

  const counts = barsData.map(b => ({ ...b, count: latest[b.key] ?? 0 }));
  const total  = counts.reduce((s, b) => s + b.count, 0);

  const barsEl = document.getElementById('analyst-bars');
  barsEl.innerHTML = counts.map(b => {
    const pct = total > 0 ? (b.count / total) * 100 : 0;
    return `
      <div class="bar-row">
        <span class="bar-label">${b.label}</span>
        <div class="bar-track">
          <div class="bar-fill ${b.cls}" style="width:${pct.toFixed(1)}%"></div>
        </div>
        <span class="bar-count">${b.count}</span>
      </div>`;
  }).join('');

  const period = latest.period === '0m' ? 'current month'
               : latest.period === '-1m' ? 'last month' : (latest.period || '');
  document.getElementById('analyst-total').textContent =
    total > 0 ? `${total} analysts rated this stock (${period})` : 'No analyst breakdown available.';

  // Price targets
  const tMean = fin.targetMeanPrice?.raw;
  const tLow  = fin.targetLowPrice?.raw;
  const tHigh = fin.targetHighPrice?.raw;

  document.getElementById('target-mean').textContent = tMean != null ? '$' + fmt(tMean) : '—';
  document.getElementById('target-low').textContent  = tLow  != null ? '$' + fmt(tLow)  : '—';
  document.getElementById('target-high').textContent = tHigh != null ? '$' + fmt(tHigh) : '—';

  const upsideEl = document.getElementById('upside-pct');
  if (tMean != null && curPrice != null && curPrice > 0) {
    const upside = ((tMean - curPrice) / curPrice) * 100;
    const sign   = upside >= 0 ? '+' : '';
    upsideEl.innerHTML = `Mean target implies <span class="${upside >= 0 ? 'up' : 'down'}">${sign}${fmt(upside, 1)}%</span> from current price`;
  } else {
    upsideEl.textContent = '';
  }

  setStatus('');
  setBtn(false);
  document.getElementById('result-card').classList.add('visible');
}

// Allow Enter key to trigger search
document.getElementById('ticker-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') lookup();
});
</script>
</body>
</html>
